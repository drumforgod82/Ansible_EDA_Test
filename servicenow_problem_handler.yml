---
# Problem counterpart to servicenow_incident_handler.yml and servicenow_sctask_handler.yml.
#
# Launched by "Team <X> Problem Handler", which every team's rulebook calls by name from its
# `Launch Team <X> Problem handler` rule. One playbook serves every team -- the per-team part is
# the rulebook and the job template, never this file.
#
# Problem needs no enrollment table: problems have no catalog item, so the assignment group is the
# only filter and the EDA Team Route table already provides it.
#
# WHY THIS USES ansible.builtin.uri AND NOT servicenow.itsm.problem
# -----------------------------------------------------------------
# servicenow.itsm.problem exists (unlike catalog task), so the obvious move is to mirror the
# incident playbook and call the module. It will not work on this instance as it stands.
#
# Since the ServiceNow *Rome* release the Table API no longer performs problem state transitions,
# so the module routes them through a server-side scripted REST API at `/api/x_rhtpp_ansible/problem`
# (the module's `base_api_path` default). That endpoint ships in the ServiceNow Store application
# "API for Red Hat Ansible Automation Platform Certified Content Collection", which is NOT installed
# here -- verified 2026-10-01: no `x_rhtpp_ansible` scope exists in sys_scope, and no scripted REST
# API answers on that base URI. Calling the module would 404 inside the collection with an error that
# reads like a credential or network fault rather than a missing application.
#
# WHY THIS PLAY DOES NOT CHANGE THE PROBLEM STATE AT ALL
# ------------------------------------------------------
# It cannot, and neither can any other Table API caller. Diagnosed 2026-10-02 after three failed
# attempts, so that nobody spends that time again:
#
#   sys_dictionary_override  problem.state            read_only = TRUE
#   sys_dictionary           problem.resolution_code  read_only = TRUE
#   sys_dictionary           problem.resolved_at      read_only = TRUE
#   sys_dictionary           problem.resolved_by      read_only = TRUE
#   sys_dictionary           task.state  (parent)     read_only = false
#
# The Table API silently DISCARDS dictionary-read-only fields. No 400, no 403, no sys_audit row --
# just HTTP 200 and nothing changed. Because `state` never changes, the before-update business rule
# `Problem Model: Check State Transition` never even fires, so this is not the state model rejecting
# anything; the write is dropped a layer earlier.
#
# What was tried, and what it cost:
#   1. Single PATCH 101 -> 106       PRB0040003 job 80, PRB0040006 job 81.  HTTP 200, state unmoved.
#   2. One rung at a time 102..106   PRB0040007 job 85.  All four rungs HTTP 200, state unmoved.
#      The ladder itself was right -- sttrm_state_transition confirms the model's path really is
#      New > Assess > Root Cause Analysis > Fix in Progress > Resolved > Closed -- but the shape of
#      the request was never the problem.
#   3. servicenow.itsm.problem       Needs the Store app, which is installed on NEITHER this PDI nor
#      Centene. Not a transferable route; do not re-propose it.
#
# THE ASYMMETRY WORTH REMEMBERING: read-only is a UI/API-layer control, not a database one. A
# SERVER-SIDE GlideRecord update -- a UI Action, a Flow Designer "Update Record" step, a Business
# Rule, a Scripted REST resource -- is NOT blocked by it, AND still runs the state model. That is why
# the Resolve button works (it is client script doing g_form.setValue + g_form.save) and why a flow
# could do this if it ever needs doing. Writing `problem_state` would also reach the database but
# would bypass the state model and leave resolution_code/resolved_at/resolved_by empty, producing a
# record in Resolved with no resolution -- worse than leaving it alone.
#
# DECISION (James, 2026-10-02): automation writes its findings; a human performs the state change.
# So this play writes cause_notes, fix_notes and close_notes -- which DO accept Table API writes --
# and deliberately sends no state and no resolution_code. The job is then honestly green when it has
# done everything it was asked to do, instead of reporting success for a transition that silently
# never happened.
- name: ServiceNow Problem Remediation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Injected as an extra var by the custom ServiceNow credential type, which needs a `host` input
    # and an `SN_HOST` injector. See README Part 1.1. Never hardcode the instance: the same playbook
    # is run by more than one organization.
    sn_instance: "{{ SN_HOST }}"

    # Gate on writing the automation findings. OFF by default so a manual launch cannot touch a real
    # record; the rulebook passes `sn_resolve_problem: true`.
    #
    # THE NAME IS NOW SLIGHTLY WRONG AND IS KEPT ON PURPOSE. This play no longer resolves anything
    # (see the header) -- the variable gates whether the cause/fix/close notes are written. Renaming
    # it means editing all three rulebooks, which invalidates their source-mapping hashes and costs a
    # sync + re-attach + restart on every team. Batch the rename with the next rulebook change
    # instead of paying that cycle for a cosmetic fix.
    sn_resolve_problem: false

    # Problem state choices on this instance, for reference only -- NOTHING here writes `state`:
    #   101 New   102 Assess   103 Root Cause Analysis   104 Fix in Progress   106 Resolved   107 Closed
    # 105 does not exist -- the sequence jumps 104 -> 106. No active Cancelled, unlike incident.
    # The report below reads the state back and names it; it does not assert a particular value,
    # because a problem can legitimately be in any state when automation runs.

    # Defaults so a MANUAL launch does not fail on an undefined variable. Extra vars from the
    # rulebook override every one of these, so this costs nothing at run time and makes the job
    # template testable on its own.
    problem_number: ""
    short_description: ""
    sys_id: ""
    assignment_group: ""
    cmdb_ci: ""
    target_team: ""
    source_stream: ""

  tasks:
    # Without this, a missing SN_HOST surfaces as a raw undefined-variable error inside a uri task,
    # which reads like a network problem rather than a credential-type problem.
    - name: Assert the ServiceNow host was injected by the credential
      ansible.builtin.assert:
        that:
          - SN_HOST is defined
          - SN_HOST | length > 0
        fail_msg: >-
          SN_HOST is not set. Add a `host` input and an `SN_HOST` extra_vars injector to the custom
          ServiceNow credential type, then re-save the ServiceNow PDI credential with the instance
          URL (including https://).
        success_msg: "ServiceNow host resolved from credential: {{ sn_instance }}"
      tags:
        - always

    - name: Display problem information
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "ServiceNow Problem Automation Triggered"
          - "======================================"
          - "Problem Number: {{ problem_number }}"
          - "Description: {{ short_description }}"
          - "Assignment Group: {{ assignment_group }}"
          - "CI: {{ cmdb_ci }}"
          - "Target Team: {{ target_team }}"
          - "Delivered By Stream: {{ source_stream }}"
          - "sys_id: {{ sys_id }}"
          - "======================================"

    # target_team empty is the signature of the action's `team_code` input being declared but never
    # pill-mapped -- it produces no error anywhere else, so say so here rather than letting it pass.
    - name: Warn when the routing keys did not arrive
      ansible.builtin.debug:
        msg: >-
          target_team is empty. The ServiceNow action's `team_code` input is probably declared but
          not mapped to a pill. Routing still worked (this job ran), but the audit trail on the
          record will not say which team.
      when: target_team | length == 0

    - name: Determine the investigation path for this problem
      ansible.builtin.set_fact:
        # Branch on the symptom, as the incident playbook does. A problem is a root-cause record,
        # so the useful split is by failure domain rather than by what was ordered.
        investigation_type: >-
          {{ 'capacity' if ('disk' in short_description | lower or 'memory' in short_description | lower)
             else 'availability' if ('down' in short_description | lower or 'outage' in short_description | lower)
             else 'generic' }}

    - name: Execute capacity investigation
      ansible.builtin.debug:
        msg: "Collecting capacity trend data for {{ cmdb_ci | default('(no CI)', true) }} on {{ problem_number }}"
      when: investigation_type == 'capacity'
      # Add the real investigation tasks here.

    - name: Execute availability investigation
      ansible.builtin.debug:
        msg: "Collecting availability history for {{ cmdb_ci | default('(no CI)', true) }} on {{ problem_number }}"
      when: investigation_type == 'availability'
      # Add the real investigation tasks here.

    - name: Execute generic investigation
      ansible.builtin.debug:
        msg: "Running generic root-cause collection for {{ problem_number }}"
      when: investigation_type == 'generic'
      # Add the real investigation tasks here.

    - name: Write a work note back to the problem
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/problem/{{ sys_id }}"
        method: PATCH
        headers:
          Content-Type: "application/json"
        user: "{{ SN_USERNAME }}"
        password: "{{ SN_PASSWORD }}"
        force_basic_auth: true
        body_format: json
        body:
          work_notes: >-
            Ansible Automation completed at {{ lookup('pipe', 'TZ=America/Chicago date "+%Y-%m-%d %H:%M:%S %Z"') }}
        validate_certs: false
        # 404 is tolerated on purpose: it means this sys_id is not on the instance, which is the
        # normal result for a synthetic smoke-test event. If 404 were fatal the play would abort
        # here and never reach the resolve gate below, so the skip path could not be tested.
        #
        # 401/403 are deliberately NOT tolerated. A 401 here is almost always a missing
        # snc_basic_auth_api_access role on the account rather than a wrong password, and
        # swallowing it would hide a real misconfiguration.
        status_code:
          - 200
          - 404
      when:
        - sys_id is defined
        - sys_id | length > 0
      register: servicenow_update

    - name: Log the work-note result
      ansible.builtin.debug:
        msg: >-
          {% if servicenow_update is skipped -%}
            No sys_id supplied, so no work note was written.
          {%- elif servicenow_update.status == 404 -%}
            sys_id {{ sys_id }} does not exist in {{ sn_instance }} (HTTP 404). No work note was
            written. Expected for a synthetic test event; investigate if this came from a real problem.
          {%- else -%}
            Problem {{ problem_number | default('(unknown)') }} updated successfully
            (HTTP {{ servicenow_update.status }}).
          {%- endif %}

    # Write the findings, and ONLY the findings. No `state`, no `resolution_code` -- see the header
    # for the dictionary-read-only evidence and the decision that a human performs the transition.
    #
    # Unlike every earlier version of this task, this one is allowed to FAIL the job: these three
    # fields do accept Table API writes, so a non-200 here is a real fault (credential, network, or
    # the record vanishing mid-run) rather than the platform declining a transition. That is the
    # difference between an honest green job and the three green jobs that changed nothing.
    - name: Write the automation findings to the problem
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/problem/{{ sys_id }}"
        method: PATCH
        headers:
          Content-Type: "application/json"
        user: "{{ SN_USERNAME }}"
        password: "{{ SN_PASSWORD }}"
        force_basic_auth: true
        body_format: json
        body:
          cause_notes: >-
            Root cause collection run by Ansible Automation. Investigation path: {{ investigation_type }}.
          fix_notes: >-
            Automated remediation completed at
            {{ lookup('pipe', 'TZ=America/Chicago date "+%Y-%m-%d %H:%M:%S %Z"') }}.
            State left unchanged for problem management to action.
          close_notes: >-
            Investigated by Ansible Automation. Investigation path: {{ investigation_type }}.
        validate_certs: false
        status_code:
          - 200
      when:
        - sn_resolve_problem | bool
        - sys_id is defined
        - sys_id | length > 0
        # Do not write to a record the work-note PATCH just proved does not exist.
        - servicenow_update.status | default(0) == 200
      register: problem_findings

    # The PATCH returning 200 is not proof the state moved -- a state model can accept the write and
    # leave `state` untouched. Read it back rather than trusting the status code.
    - name: Read the problem back to confirm what the instance stored
      ansible.builtin.uri:
        url: "{{ sn_instance }}/api/now/table/problem/{{ sys_id }}?sysparm_fields=number,state,cause_notes,fix_notes&sysparm_display_value=all"
        method: GET
        user: "{{ SN_USERNAME }}"
        password: "{{ SN_PASSWORD }}"
        force_basic_auth: true
        validate_certs: false
        status_code:
          - 200
      when: problem_findings is not skipped
      register: problem_readback

    # The read-back is kept even though the PATCH can now fail the job, because a 200 that writes
    # nothing is exactly the failure this play already hit three times. Verify, do not assume.
    - name: Report what was written and what was deliberately left alone
      ansible.builtin.debug:
        msg: >-
          {% set notes_landed = problem_readback.json.result.cause_notes.display_value | default('') | length > 0 -%}
          {% if notes_landed -%}
            Problem {{ problem_number | default('(unknown)') }}: findings written (cause_notes and
            fix_notes populated). State left at
            {{ problem_readback.json.result.state.display_value | default('unknown') }} BY DESIGN --
            problem.state is read-only to the Table API, and the transition is problem management's
            to make. This is a complete, successful run.
          {%- else -%}
            Problem {{ problem_number | default('(unknown)') }}: the PATCH returned
            HTTP {{ problem_findings.status | default('n/a') }} but cause_notes read back EMPTY.
            That means a field this play writes has become read-only too -- re-check
            sys_dictionary and sys_dictionary_override for the problem table before assuming a
            credential or network fault.
          {%- endif %}
      when: problem_findings is not skipped

    # Says WHICH gate stopped the write. Without this a skip is invisible in the job output and looks
    # identical to a write that silently did nothing.
    - name: Report that the findings write was skipped
      ansible.builtin.debug:
        msg: >-
          Problem {{ problem_number | default('(unknown)') }}: no findings were written --
          {% if not (sn_resolve_problem | bool) -%}
            sn_resolve_problem is false. Pass -e sn_resolve_problem=true to write them.
          {%- elif not (sys_id is defined and sys_id | length > 0) -%}
            no sys_id was supplied.
          {%- else -%}
            sys_id {{ sys_id }} was not found in {{ sn_instance }} (the work-note PATCH returned
            {{ servicenow_update.status | default('n/a') }}).
          {%- endif %}
      when: problem_findings is skipped

    - name: Print problem summary
      ansible.builtin.debug:
        msg:
          - "============ Problem Summary ============"
          - "Problem Number: {{ problem_number }}"
          - "Investigation Path: {{ investigation_type }}"
          - "Findings Written: cause_notes, fix_notes, close_notes"
          - "State: {{ problem_readback.json.result.state.display_value | default('(not read back)') }} (not changed by automation, by design)"
          - "Problem URL: {{ sn_instance }}/problem.do?sys_id={{ sys_id }}"
      when: problem_findings is not skipped
