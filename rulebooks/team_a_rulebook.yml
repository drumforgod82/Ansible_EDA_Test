---
# Team A incident automation.
#
# The ansible.eda.webhook source below is a PLACEHOLDER. In AAP the activation's
# event-stream source mapping replaces it at runtime with eda.builtin.pg_listener
# (see README Part 2.6). The port is never actually bound.
#
# Any edit to this file changes the SHA the source mapping is pinned to, so the
# cycle for every change is:
#   push -> sync the EDA project -> re-attach the event stream -> restart
# Skipping the re-attach leaves the activation on the old hash and it fails with
# "Rulebook has changed since the sources were mapped."
- name: Team A - ServiceNow incident automation
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Launch Team A incident handler
      # eda_event_stream_name is injected by the platform, not the sender, so it
      # cannot be forged and is the primary tenant check. event_type is checked
      # too so a future event family on the same stream does not fire this rule.
      # Both must be true to launch: fail-closed, never launch-unless.
      condition: >-
        event.meta.eda_event_stream_name == "sn-team-a" and
        event.payload.event_type == "servicenow.incident.created"
      action:
        run_job_template:
          name: "Team A Incident Handler"
          organization: "Team A"
          job_args:
            extra_vars:
              # default('') on EVERY mapping. One missing key without it fails the
              # whole action with "Object of type StrictUndefined is not JSON
              # serializable" and launches nothing at all.
              incident_number: "{{ event.payload.incident_number | default('') }}"
              short_description: "{{ event.payload.short_description | default('') }}"
              priority: "{{ event.payload.priority | default('') }}"
              cmdb_ci: "{{ event.payload.cmdb_ci | default('') }}"
              state: "{{ event.payload.state | default('') }}"
              assigned_to: "{{ event.payload.assigned_to | default('') }}"
              category: "{{ event.payload.category | default('') }}"
              sys_id: "{{ event.payload.sys_id | default('') }}"
              # Reserved routing keys, carried through for audit and debugging.
              event_version: "{{ event.payload.event_version | default('') }}"
              source: "{{ event.payload.source | default('') }}"
              target_team: "{{ event.payload.target_team | default('') }}"
              # Which stream actually delivered this event.
              source_stream: "{{ event.meta.eda_event_stream_name | default('') }}"
