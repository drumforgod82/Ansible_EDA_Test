---
# Team A incident, SCTASK and problem automation.
#
# The ansible.eda.webhook source below is a PLACEHOLDER. In AAP the activation's
# event-stream source mapping replaces it at runtime with eda.builtin.pg_listener
# (see docs/03-aap-eda-setup.md section 2.12). The port is never actually bound.
#
# Any edit to this file changes the SHA the source mapping is pinned to, so the
# cycle for every change is:
#   push -> sync the EDA project -> re-attach the event stream -> restart
# Skipping the re-attach leaves the activation on the old hash and it fails with
# "Rulebook has changed since the sources were mapped."
# The ruleset name is what `ansible_eda.ruleset` reports on every launched job, so it must not
# name one record type -- this rulebook handles three. A stale name here is not a functional bug,
# but it is the first thing you read when diagnosing and it will mislead you.
- name: Team A - ServiceNow event automation
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Launch Team A incident handler
      # eda_event_stream_name is injected by the platform, not the sender, so it
      # cannot be forged and is the primary tenant check. event_type is checked
      # too so a future event family on the same stream does not fire this rule.
      # Both must be true to launch: fail-closed, never launch-unless.
      condition: >-
        event.meta.eda_event_stream_name == "sn-team-a" and
        event.payload.event_type == "servicenow.incident.created"
      action:
        run_job_template:
          name: "Team A Incident Handler"
          organization: "Team A"
          job_args:
            extra_vars:
              # default('') on EVERY mapping. One missing key without it fails the
              # whole action with "Object of type StrictUndefined is not JSON
              # serializable" and launches nothing at all.
              incident_number: "{{ event.payload.incident_number | default('') }}"
              short_description: "{{ event.payload.short_description | default('') }}"
              priority: "{{ event.payload.priority | default('') }}"
              cmdb_ci: "{{ event.payload.cmdb_ci | default('') }}"
              state: "{{ event.payload.state | default('') }}"
              assigned_to: "{{ event.payload.assigned_to | default('') }}"
              category: "{{ event.payload.category | default('') }}"
              sys_id: "{{ event.payload.sys_id | default('') }}"
              # Reserved routing keys, carried through for audit and debugging.
              event_version: "{{ event.payload.event_version | default('') }}"
              source: "{{ event.payload.source | default('') }}"
              target_team: "{{ event.payload.target_team | default('') }}"
              # Which stream actually delivered this event.
              source_stream: "{{ event.meta.eda_event_stream_name | default('') }}"
              # Close the incident. The playbook defaults this to false to stop two orgs
              # racing to close one ticket, which was only possible under the old
              # single-stream fan-out. Per-team streams plus the EDA Team Route table send
              # each incident to exactly one team, and activation 1 is stopped, so the race
              # cannot occur. Enabled on both teams to keep behaviour symmetric.
              sn_close_incident: true

    - name: Launch Team A SCTASK handler
      condition: >-
        event.meta.eda_event_stream_name == "sn-team-a" and
        event.payload.event_type == "servicenow.sctask.created"
      action:
        run_job_template:
          name: "Team A SCTASK Handler"
          organization: "Team A"
          job_args:
            extra_vars:
              task_number: "{{ event.payload.task_number | default('') }}"
              short_description: "{{ event.payload.short_description | default('') }}"
              catalog_item: "{{ event.payload.catalog_item | default('') }}"
              assignment_group: "{{ event.payload.assignment_group | default('') }}"
              sys_id: "{{ event.payload.sys_id | default('') }}"
              # Reserved routing keys, carried through for audit and debugging.
              event_version: "{{ event.payload.event_version | default('') }}"
              source: "{{ event.payload.source | default('') }}"
              target_team: "{{ event.payload.target_team | default('') }}"
              # Which stream actually delivered this event.
              source_stream: "{{ event.meta.eda_event_stream_name | default('') }}"
              # Close the task. The playbook defaults this to false to stop two orgs
              # racing to close one task, which was only possible under the old
              # single-stream fan-out. Per-team streams plus the EDA Team Route table send
              # each task to exactly one team, and activation 1 is stopped, so the race
              # cannot occur. Enabled on both teams to keep behaviour symmetric.
              sn_close_task: true

    - name: Launch Team A Problem handler
      condition: >-
        event.meta.eda_event_stream_name == "sn-team-a" and
        event.payload.event_type == "servicenow.problem.created"
      action:
        run_job_template:
          name: "Team A Problem Handler"
          organization: "Team A"
          job_args:
            extra_vars:
              problem_number: "{{ event.payload.problem_number | default('') }}"
              short_description: "{{ event.payload.short_description | default('') }}"
              assignment_group: "{{ event.payload.assignment_group | default('') }}"
              cmdb_ci: "{{ event.payload.cmdb_ci | default('') }}"
              sys_id: "{{ event.payload.sys_id | default('') }}"
              # Reserved routing keys, carried through for audit and debugging.
              event_version: "{{ event.payload.event_version | default('') }}"
              source: "{{ event.payload.source | default('') }}"
              target_team: "{{ event.payload.target_team | default('') }}"
              # Which stream actually delivered this event.
              source_stream: "{{ event.meta.eda_event_stream_name | default('') }}"
              # sn_resolve_problem, NOT sn_close_problem: the playbook targets Resolved (106) and
              # leaves the formal close to problem management. The playbook defaults it to false so
              # a manual launch cannot move a real record.
              sn_resolve_problem: true
