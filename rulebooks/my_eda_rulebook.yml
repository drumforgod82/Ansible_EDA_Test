---
# REFERENCE ONLY - the original single-stream, single-team shape. KEPT ON PURPOSE as a starting
# point for anyone who wants ONE rulebook instead of one per team. Decided 2026-10-07; do not
# delete it. The per-team production shape is team_a/b/c_rulebook.yml plus the EDA Team Route
# table - see docs/04-servicenow-app.md and docs/design-decisions.md section 1.
#
# DO NOT ATTACH THIS TO AN ACTIVATION AS-IS. It is inert: three things below are stale or
# placeholder, and it matches nothing even if activated.
#
# To make it a working single-team rulebook, change all four:
#   1. event_type values     "incident_created" -> "servicenow.incident.created"
#                            "sctask_created"   -> "servicenow.sctask.created"
#                            The current payload contract is docs/05-servicenow-action.md section 7.
#   2. run_job_template.name "ServiceNow Incident Handler" does not exist. Use a real template
#                            name - it is matched as an exact string, see docs/rulebook-anatomy.md.
#   3. organization          "Default" - point it at the organization that owns the template.
#   4. the <...> placeholders in the sctask rule.
#
# It deliberately does NOT test event.meta.eda_event_stream_name. That is fine for one stream and
# one team, and it is exactly what you must add if you ever run more than one - without it, every
# activation on a shared stream fires on every event. docs/rulebook-anatomy.md section 2.2.
- name: ServiceNow Incident Automation - Simple Test
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Run incident handler on new incidents
      condition: event.payload.event_type == "incident_created"
      action:
        run_job_template:
          name: "ServiceNow Incident Handler"
          organization: "Default"
          job_args:
            extra_vars:
              # default('') on EVERY mapping. Without it, one key missing from the
              # event (an unassigned incident has no assigned_to, for example) fails
              # the whole action with "Object of type StrictUndefined is not JSON
              # serializable" and launches no job at all -- the event is silently
              # dropped, with no partial launch and no retry.
              incident_number: "{{ event.payload.incident_number | default('') }}"
              short_description: "{{ event.payload.short_description | default('') }}"
              priority: "{{ event.payload.priority | default('') }}"
              cmdb_ci: "{{ event.payload.cmdb_ci | default('') }}"
              state: "{{ event.payload.state | default('') }}"
              assigned_to: "{{ event.payload.assigned_to | default('') }}"
              category: "{{ event.payload.category | default('') }}"
              sys_id: "{{ event.payload.sys_id | default('') }}"

    - name: Run sctask handlers
      condition: >-
        event.payload.event_type == "sctask_created" and
        event.payload.catalog_item == "<Enter Catalog Item name here>"
      action:
        run_job_template:
          name: "<your AAP template name>"
          organization: "Default"
          job_args:
            extra_vars:
              sn_event: "{{ event.payload }}"

    # - name: Log All Incoming Incidents
    #   condition: event.payload.event_type == "incident_created"
    #   action:
    #     debug:
    #       msg: |
    #         New Incident from ServiceNow:
    #         Number: {{ event.payload.incident_number }}
    #         Description: {{ event.payload.short_description }}
    #         Priority: {{ event.payload.priority }}
    #         CI: {{ event.payload.cmdb_ci }}
    #         Sys ID: {{ event.payload.sys_id }}

