---
# Validates the rulebook condition and every Jinja reference against a
# ServiceNow-shaped payload, with no controller required.
# The action is a debug print instead of run_job_template; the condition and
# the variable references are identical to the committed rulebook.
- name: ServiceNow Incident Automation - Logic Check
  hosts: all
  sources:
    - ansible.eda.generic:
        payload:
          - payload:
              event_type: incident_created
              incident_number: INC0010001
              short_description: Disk space low on server
              priority: 2
              cmdb_ci: testserver01
              state: In Progress
              assigned_to: admin
              category: hardware
              sys_id: 9fa84752eb031100c3346f5ca206feee
          - payload:
              event_type: incident_updated
              incident_number: INC0010002
              short_description: Should not match
              priority: 4
              cmdb_ci: testserver02
              state: New
              assigned_to: admin
              category: software
              sys_id: 0000000000000000000000000000dead

  rules:
    - name: Run incident handler on new incidents
      condition: event.payload.event_type == "incident_created"
      action:
        debug:
          msg:
            - "MATCHED - these are the extra_vars the job template would receive:"
            - "incident_number   = {{ event.payload.incident_number }}"
            - "short_description = {{ event.payload.short_description }}"
            - "priority          = {{ event.payload.priority }}"
            - "cmdb_ci           = {{ event.payload.cmdb_ci }}"
            - "state             = {{ event.payload.state }}"
            - "assigned_to       = {{ event.payload.assigned_to }}"
            - "category          = {{ event.payload.category }}"
            - "sys_id            = {{ event.payload.sys_id }}"
